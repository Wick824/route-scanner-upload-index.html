<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>NRX Route Scanner</title>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{--bg:#0f172a;--panel:#111827;--line:#334155;--txt:#f8fafc;--muted:#94a3b8;--green:#16a34a;--yellow:#d97706;--red:#dc2626;--blue:#2563eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:720px;margin:auto;padding:16px 14px 32px}
h1{font-size:24px;margin:4px 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
label.title{display:block;font-weight:800;margin-bottom:8px}
input[type=file]{width:100%;font-size:16px}
button{width:100%;border:0;border-radius:14px;padding:16px;font-size:19px;font-weight:900;color:#fff;background:var(--blue);margin-top:9px}
button.secondary{background:#334155} button.danger{background:#991b1b}
button:disabled{opacity:.45}
#manual{width:100%;border-radius:12px;border:2px solid var(--blue);padding:14px;font-size:20px;margin-top:9px}
#videoWrap{display:none;position:relative;border-radius:16px;overflow:hidden;background:#000;margin-top:10px}
#video{width:100%;display:block;min-height:240px;object-fit:cover}
.scanline{position:absolute;left:8%;right:8%;top:50%;height:3px;background:#22c55e;box-shadow:0 0 12px #22c55e}
#result{min-height:270px;border:2px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.route{font-size:58px;line-height:.98;font-weight:1000;word-break:break-word}.state{font-size:20px;font-weight:900;margin-top:12px}
.order{font-size:20px;font-weight:800;margin-top:16px}.name{font-size:18px;margin-top:8px}.addr{font-size:14px;color:#cbd5e1;margin-top:6px}
.green{background:rgba(22,163,74,.16);border-color:var(--green)!important}.green .route,.green .state{color:#4ade80}
.yellow{background:rgba(217,119,6,.16);border-color:var(--yellow)!important}.yellow .route,.yellow .state{color:#fbbf24}
.red{background:rgba(220,38,38,.16);border-color:var(--red)!important}.red .route,.red .state{color:#f87171}
.blue{background:rgba(37,99,235,.12);border-color:var(--blue)!important}.blue .route,.blue .state{color:#60a5fa}
.status{font-size:13px;color:var(--muted);margin-top:7px}.good{color:#4ade80}.bad{color:#f87171}
#photoInput{display:none}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:7px;border-bottom:1px solid var(--line);text-align:left}
@media(min-width:500px){.route{font-size:72px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Route Scanner</h1>
  <div class="sub">Scan → mark route → stage → final manifest verification</div>

  <div class="card">
    <label class="title">1. Load today's Descartes CSV</label>
    <input id="csvFile" type="file" accept=".csv,text/csv">
    <div id="fileStatus" class="status">No CSV loaded.</div>
  </div>

  <div class="card">
    <label class="title">2. Scan an orange label</label>
    <button id="cameraBtn" disabled>START LIVE CAMERA</button>
    <button id="photoBtn" class="secondary" disabled>TAKE PHOTO / SCAN</button>
    <input id="photoInput" type="file" accept="image/*" capture="environment">
    <input id="manual" placeholder="Or type/scan order #" autocomplete="off" autocapitalize="characters" disabled>
    <button id="lookupBtn" class="secondary" disabled>LOOK UP ORDER</button>
    <div id="camStatus" class="status">Live camera requires browser camera permission. Photo scan is the fallback.</div>
    <div id="videoWrap"><video id="video" playsinline muted></video><div class="scanline"></div></div>
  </div>

  <div id="result" class="blue">
    <div class="route">READY</div>
    <div class="state">LOAD TODAY'S CSV</div>
  </div>

  <div class="card">
    <label class="title">Recent scans</label>
    <table><thead><tr><th>Order</th><th>Route</th></tr></thead><tbody id="history"></tbody></table>
  </div>
</div>

<script>
let lookup=new Map(), codeReader=null, scanning=false, lastScan="", lastScanTime=0;

function parseCSV(text){
  const rows=[];let row=[],field="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(q){if(c=='"'&&n=='"'){field+='"';i++;}else if(c=='"'){q=false}else field+=c}
    else{if(c=='"')q=true;else if(c==','){row.push(field);field=""}else if(c=='\n'){row.push(field);rows.push(row);row=[];field=""}else if(c!='\r')field+=c}
  }
  if(field.length||row.length){row.push(field);rows.push(row)} return rows;
}
const norm=s=>(s||"").trim().toUpperCase();
const esc=s=>String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");

function vibrate(pattern){try{if(navigator.vibrate)navigator.vibrate(pattern)}catch(e){}}
function beep(ok=true){
  try{
    const C=window.AudioContext||window.webkitAudioContext, ctx=new C(), o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);o.frequency.value=ok?880:220;g.gain.value=.09;o.start();o.stop(ctx.currentTime+.12);
  }catch(e){}
}
function render(cls,route,state,rec={}){
  const r=document.getElementById("result"); r.className=cls;
  const addr=[rec.address,rec.city,rec.state,rec.zip].filter(Boolean).join(", ");
  r.innerHTML=`<div class="route">${esc(route)}</div><div class="state">${esc(state)}</div>
    ${rec.order?`<div class="order">${esc(rec.order)}</div>`:""}
    ${rec.name?`<div class="name">${esc(rec.name)}</div>`:""}
    ${addr?`<div class="addr">${esc(addr)}</div>`:""}`;
}
function history(order,route){
  const tb=document.getElementById("history"), tr=document.createElement("tr");
  tr.innerHTML=`<td>${esc(order)}</td><td>${esc(route)}</td>`;tb.prepend(tr);
  while(tb.children.length>8)tb.removeChild(tb.lastChild);
}
function lookupOrder(raw){
  const order=norm(raw); if(!order)return;
  const now=Date.now(); if(order===lastScan && now-lastScanTime<1800)return;
  lastScan=order;lastScanTime=now;

  const rows=lookup.get(order)||[];
  if(!rows.length){
    render("yellow","NOT ROUTED","HOLD / DO NOT STAGE",{order});beep(false);vibrate([150,80,150]);history(order,"NOT ROUTED");return;
  }
  const routes=[...new Set(rows.map(r=>r.route).filter(Boolean))];
  if(routes.length===0){
    render("yellow","NOT ROUTED","NO ROUTE IN EXPORT",rows[0]);beep(false);vibrate([150,80,150]);history(order,"NOT ROUTED");
  }else if(routes.length>1){
    render("red","CHECK","MULTIPLE ROUTES: "+routes.join(" / "),rows[0]);beep(false);vibrate([250,80,250]);history(order,"CHECK");
  }else{
    render("green",routes[0],"STAGE TO THIS ROUTE",rows[0]);beep(true);vibrate(100);history(order,routes[0]);
  }
  document.getElementById("manual").value="";
}

document.getElementById("csvFile").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  const rows=parseCSV(await f.text()), headers=rows[0].map(x=>x.trim()), ix={};
  headers.forEach((h,i)=>ix[h.toLowerCase()]=i);
  const oi=ix["order #"],ri=ix["route"],ni=ix["name"],ai=ix["address"],ci=ix["city"],si=ix["state/province"],zi=ix["zip/postal code"];
  if(oi===undefined||ri===undefined){alert('Need columns "Order #" and "Route".');return}
  lookup=new Map();let count=0;
  for(let i=1;i<rows.length;i++){
    const c=rows[i],order=norm(c[oi]);if(!order)continue;
    const rec={order,route:norm(c[ri]),name:ni===undefined?"":(c[ni]||"").trim(),address:ai===undefined?"":(c[ai]||"").trim(),city:ci===undefined?"":(c[ci]||"").trim(),state:si===undefined?"":(c[si]||"").trim(),zip:zi===undefined?"":(c[zi]||"").trim()};
    if(!lookup.has(order))lookup.set(order,[]);lookup.get(order).push(rec);count++;
  }
  document.getElementById("fileStatus").innerHTML=`<span class="good">✓ ${esc(f.name)} loaded — ${count} order rows</span>`;
  ["cameraBtn","photoBtn","manual","lookupBtn"].forEach(id=>document.getElementById(id).disabled=false);
  render("blue","READY","SCAN A LABEL");
});

document.getElementById("lookupBtn").onclick=()=>lookupOrder(document.getElementById("manual").value);
document.getElementById("manual").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();lookupOrder(e.target.value)}});

async function startLive(){
  const btn=document.getElementById("cameraBtn"), wrap=document.getElementById("videoWrap"), video=document.getElementById("video"), st=document.getElementById("camStatus");
  if(scanning){
    scanning=false; try{if(codeReader)codeReader.reset()}catch(e){}
    if(video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop());
    wrap.style.display="none";btn.textContent="START LIVE CAMERA";return;
  }
  if(!window.ZXing){
    st.innerHTML='<span class="bad">Scanner library unavailable. Use TAKE PHOTO / SCAN or manual entry.</span>';return;
  }
  try{
    codeReader=new ZXing.BrowserMultiFormatReader();
    wrap.style.display="block";btn.textContent="STOP CAMERA";scanning=true;
    st.textContent="Aim the barcode inside the camera view.";
    await codeReader.decodeFromConstraints({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}},video,(result,err)=>{
      if(result && scanning) lookupOrder(result.getText());
    });
  }catch(err){
    scanning=false;wrap.style.display="none";btn.textContent="START LIVE CAMERA";
    st.innerHTML='<span class="bad">Live camera could not start. Use TAKE PHOTO / SCAN instead.</span>';
  }
}
document.getElementById("cameraBtn").onclick=startLive;

document.getElementById("photoBtn").onclick=()=>document.getElementById("photoInput").click();
document.getElementById("photoInput").addEventListener("change",async e=>{
  const f=e.target.files[0]; if(!f)return;
  const st=document.getElementById("camStatus");
  if(!window.ZXing){st.innerHTML='<span class="bad">Barcode decoder did not load. Check internet connection.</span>';return}
  const url=URL.createObjectURL(f), img=new Image();
  img.onload=async()=>{
    try{
      const reader=new ZXing.BrowserMultiFormatReader();
      const result=await reader.decodeFromImageElement(img);
      lookupOrder(result.getText());st.innerHTML='<span class="good">✓ Barcode read from photo.</span>';
    }catch(err){st.innerHTML='<span class="bad">Could not read barcode. Move closer, keep label flat, and try again.</span>'}
    URL.revokeObjectURL(url);e.target.value="";
  };
  img.src=url;
});
</script>
</body>
</html>
